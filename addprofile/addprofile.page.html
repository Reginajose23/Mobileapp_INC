<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
        <ion-menu-button>
          </ion-menu-button>
    </ion-buttons>
    <ion-title>Add Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
<ion-list>
  <ion-grid>
  
  <ion-row>
    <ion-col>
      <ion-item class="input_box" lines='none'>        
        <ion-input type='text'  placeholder="Name" [(ngModel)]="name"></ion-input>
        <ion-icon name="person-circle" slot="start"></ion-icon>    </ion-item>
      </ion-col>
  </ion-row>
  {{name}}
 
  <ion-row>
    <ion-col>
      <ion-item class="input_box" lines='none'>        
        <ion-input type='text'  placeholder="Mobile" [(ngModel)]="mob"></ion-input>
        <ion-icon name="call" slot="start"></ion-icon>    </ion-item>
      </ion-col>
  </ion-row>

  <ion-row>
    <ion-col>
      <ion-item class="input_box" lines='none'>        
        <ion-input type='text'  placeholder="Address" [(ngModel)]="address"></ion-input>
        <ion-icon name="home" slot="start"></ion-icon>   </ion-item>
      </ion-col>
  </ion-row>

  <ion-row>
    <ion-col>
      <ion-item class="input_box" lines='none'>        
        <ion-input type='text'  placeholder="Email" [(ngModel)]="email"></ion-input>
        <ion-icon name="mail" slot="start"></ion-icon>   </ion-item>
      </ion-col>
  </ion-row>
  
  
  <ion-button expand="full" color="danger" shape="round">Submit</ion-button>

  </ion-grid>
</ion-list>
</ion-content>
