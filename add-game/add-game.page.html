<ion-header> <ion-toolbar>
  <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
  </ion-buttons>
<ion-title>
  Add Game
</ion-title>
</ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <ion-card>
      <ion-card-header>
        <h2>Add Game Details</h2>
      </ion-card-header>
      <ion-card-content>
        <div class="ion-padding">
          <div class="wrap-input" padding>
            <input class="input" type="text" [(ngModel)]="video_link" placeholder="Game Link">
          </div>
    
         
    
        
          <div class="container-form-btn">
            <ion-button (click)="testClick()">Submit</ion-button>

           </div>
      </div>
      </ion-card-content>
      </ion-card>
      </div>

</ion-content>
