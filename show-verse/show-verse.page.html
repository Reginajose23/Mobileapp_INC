<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
  </ion-buttons>

  <div class="back-circle"></div>
  <ion-title class="ion-text-center custom-font">Daily Verse</ion-title>
 </ion-toolbar>
</ion-header>

<ion-content>
  <div class="contact-wrap">
    <div class="contact-in">
  
  <ion-item lines="none"  *ngFor="let video1 of videos2;let i=index;">
    <ion-card>
      <img [src]="video1.image  | safepipe:'resourceUrl'"/>
      <ion-card-content>
        <ion-button (click)="getvalue(video1.id)">Delete</ion-button>
      </ion-card-content>   
    </ion-card>

</ion-item>
</div>
</div>

</ion-content>
